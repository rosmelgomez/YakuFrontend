server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con proxy_pass a un nombre fijo, nginx resolvia
    # "backend" una sola vez al arrancar: al recrear el contenedor del backend
    # (nueva IP) todas las llamadas a /api daban 502 hasta reiniciar el
    # frontend. Usando una variable, el nombre se vuelve a resolver en cada
    # peticion (cache de 10 s).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Con variable, proxy_pass no recorta el prefijo: se quita aqui /api.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
